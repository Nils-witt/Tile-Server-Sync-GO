version: 2

before:
  hooks:
    # The Go build below embeds frontend/dist via frontend/embed.go, so the
    # SPA must be built first — go:embed has no way to invoke npm itself.
    # Top-level `before.hooks` entries are plain argv strings (parsed with
    # shellwords, no real shell — no `&&`/`cd`), unlike per-build pre/post
    # hooks, which do support the `cmd`/`dir` map form. `npm --prefix` is
    # npm's own way to target another directory without needing a shell cd.
    - npm --prefix frontend ci
    - npm --prefix frontend run build
    - go mod tidy

builds:
  - id: Tile-Server-Sync-GO
    main: ./cmd/Tile-Server-Sync-GO
    binary: Tile-Server-Sync-GO
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: Tile-Server-Sync-GO
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - config.example.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
