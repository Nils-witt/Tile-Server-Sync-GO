# Copy this file to config.yaml.
#
# This is now just a small bootstrap file: it points at the SQLite database
# holding the rest of the configuration (API credentials, database target,
# and maps — each with its own optional sync interval) and configures the
# optional status/config web server. Everything that used to live directly
# in this file (api, database, maps) is entered instead through that web
# server's "/config" page after startup — there's no other way to set it on
# a fresh install, so webServer.enabled needs to be true at least once to
# configure anything.
#
# config.yaml is git-ignored so nothing sensitive lands in it — the SQLite
# database itself (default "config.db", next to this file) does hold
# credentials, so treat its file permissions the same way you would this
# file's.

# Path to the SQLite database file holding api/database/maps (each map's
# own interval included) config. Relative paths resolve against this file's
# own directory. Defaults to "config.db" if omitted.
# configDb: "config.db"

# Optional HTTP server exposing a status page (last sync results per
# map/version and recent log output) at "/", plus a config editor at
# "/config" backed by a JSON API at "/api/config". The editor's "Apply saved
# config now" button makes a saved change take effect immediately, without a
# restart, and its "Sync now" button runs a sync immediately instead of
# waiting for the next interval tick. Changing webServer.enabled/address
# itself always needs a process restart — the editor shows these two values
# read-only for that reason. None of this has authentication, so only
# enable it on a trusted network.
webServer:
  enabled: true
  address: ":8080"

# Optional OpenID Connect single sign-on for the web server, in addition to
# local username/password accounts (which always keep working). Changing
# anything here needs a restart.
#
# The browser runs the login itself, as a public client (authorization code
# + PKCE, no client secret), and then sends the provider's access token with
# every API request. Register the client at your provider as a public / SPA
# client with:
#   - redirect URI:  <this server's external URL>/login/sso/callback
#   - web origin (CORS) allowed: <this server's external URL>
#   - access tokens issued as JWTs whose "azp" or "aud" claim is clientId
#
# A first SSO login links to an existing local account with the same username
# (email, else preferred_username, else the subject ID), or otherwise creates
# one with defaultPermissions. SSO accounts are never made superusers
# automatically; grant that on the /users page.
oidc:
  enabled: false
  issuerUrl: "https://accounts.example.com/realms/example"
  clientId: "tile-server-sync"
  # scopes: "openid profile email"   # default
  # Add "offline_access" (and allow it at the provider) to get a refresh
  # token, so sessions are renewed in the background. Without one, users are
  # sent back to the login page whenever the access token expires — renewal
  # never uses a hidden iframe, which many providers block.
  # scopes: "openid profile email offline_access"
  # buttonLabel: "Sign in with SSO"  # default
  defaultPermissions:
    viewStatus: true
    triggerSync: false
    viewConfig: false
    editConfigApi: false
    editConfigDatabase: false
    editConfigMaps: false
