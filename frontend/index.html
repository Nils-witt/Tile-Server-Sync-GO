<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tile-Server-Sync-GO</title>
    <script>
      // Applied before first paint to avoid a light/dark flash — the
      // in-React ThemeContext (src/theme/ThemeContext.tsx) reads the same
      // localStorage key afterwards and only ever writes it back, never
      // fighting what this sets.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) { /* localStorage unavailable (private mode, etc.) */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
