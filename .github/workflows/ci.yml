name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # New advisories land in the Go vulnerability database without any code
  # change here — re-run govulncheck weekly so they surface on their own.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Superseded pushes to the same PR/branch cancel their still-running CI.
# main is never cancelled, so every commit there gets a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend & binary build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check & build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The binary embeds frontend/dist via frontend/embed.go — build it here,
      # right next to the real SPA build, instead of shipping dist to another
      # job as an artifact. Vet/test/lint below don't need the real dist (the
      # tracked placeholder index.html satisfies go:embed), so they run in
      # parallel with this job rather than waiting on it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -trimpath -o Tile-Server-Sync-GO ./cmd/Tile-Server-Sync-GO

  test:
    name: Vet & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # golangci-lint-action keeps its own cache (module + analysis
          # cache); setup-go's would just duplicate the module download.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
